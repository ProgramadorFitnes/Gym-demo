<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym QA - Registro y Cobro Inicial</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

<!-- Header Navigation -->
<nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-dumbbell text-indigo-300"></i> Control Gym QA
        </h1>
        <a href="index.html"
           class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 border border-indigo-500 font-medium text-sm px-4 py-2 rounded-lg transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Volver al Panel
        </a>
    </div>
</nav>

<!-- Main Container -->
<main class="flex-grow flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white max-w-xl w-full rounded-2xl shadow-xl border border-gray-100 overflow-hidden">

        <!-- Card Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 p-6 text-white text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/10 rounded-full mb-3">
                <i class="fa-solid fa-user-plus text-2xl text-indigo-200"></i>
            </div>
            <h2 class="text-2xl font-bold">Registrar Nuevo Socio</h2>
            <p class="text-indigo-200 text-sm mt-1">Completa los datos del usuario y registra su pago inicial</p>
        </div>

        <!-- Form -->
        <form id="formRegistro" onsubmit="procesarRegistroYPago(event)" class="p-6 sm:p-8 space-y-5">

            <!-- Código Socio -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Código de Socio / PIN</label>
                <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-id-card"></i>
                        </span>
                    <input type="text" id="codigoSocio" maxlength="7" required autofocus placeholder="Ej. 1001"
                           class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-mono uppercase transition">
                </div>
            </div>

            <!-- Nombre y Apellido -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre(s)</label>
                    <input type="text" id="nombre" maxlength="50" required placeholder="Juan"
                           class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Apellido(s)</label>
                    <input type="text" id="apellido" maxlength="60" required placeholder="Pérez"
                           class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Teléfono y Correo -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Teléfono</label>
                    <input type="tel" id="telefono" maxlength="10" placeholder="2221234567"
                           class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="correo" maxlength="100" placeholder="socio@ejemplo.com"
                           class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Checkbox Empleado / Staff -->
            <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <input type="checkbox" id="esEmpleado" onchange="toggleSeccionPago()" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300">
                <label for="esEmpleado" class="text-sm font-medium text-gray-700 cursor-pointer select-none">
                    ¿Es Empleado / Staff? <span class="text-xs text-gray-500 font-normal block">(Paso libre sin cobro inicial)</span>
                </label>
            </div>

            <!-- SECCIÓN DE PAGO INICIAL (Se oculta si es empleado) -->
            <div id="seccionPago" class="border-t border-gray-200 pt-4 space-y-4">
                <h3 class="text-sm font-bold text-indigo-700 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-receipt"></i> Pago de Inscripción / Membresía
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Monto ($)</label>
                        <input type="number" step="0.01" id="monto" placeholder="350.00" value="350.00"
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-semibold text-gray-800">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Método de Pago</label>
                        <select id="metodoPago" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Meses</label>
                        <input type="number" id="meses" min="1" value="1"
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btnSubmit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Registrar y Cobrar
            </button>

            <!-- Feedback Div -->
            <div id="respuesta" class="hidden p-4 rounded-lg text-sm font-medium text-center transition-all"></div>

        </form>
    </div>
</main>

<!-- JS Logic -->
<script>
    const API_BASE = '/api/v1';

    function toggleSeccionPago() {
        const esEmpleado = document.getElementById("esEmpleado").checked;
        const seccionPago = document.getElementById("seccionPago");
        if (esEmpleado) {
            seccionPago.classList.add("hidden");
        } else {
            seccionPago.classList.remove("hidden");
        }
    }

    async function procesarRegistroYPago(event) {
        event.preventDefault();

        const respuestaDiv = document.getElementById("respuesta");
        const btnSubmit = document.getElementById("btnSubmit");

        respuestaDiv.classList.add("hidden");
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Procesando...`;

        const codigoSocio = document.getElementById("codigoSocio").value.trim().toUpperCase();
        const esEmpleado = document.getElementById("esEmpleado").checked;

        // 1. Datos del Usuario
        const usuarioData = {
            codigoSocio: codigoSocio,
            nombre: document.getElementById("nombre").value.trim(),
            apellido: document.getElementById("apellido").value.trim(),
            telefono: document.getElementById("telefono").value.trim(),
            correo: document.getElementById("correo").value.trim(),
            esEmpleado: esEmpleado
        };

        try {
            // PASO 1: Registrar Usuario en Backend
            const resUsuario = await fetch(`${API_BASE}/usuarios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(usuarioData)
            });

            if (!resUsuario.ok) {
                const errorText = await resUsuario.text();
                throw new Error(`Error en registro de socio: ${errorText}`);
            }

            // PASO 2: Si NO es empleado, registrar el pago inicial
            if (!esEmpleado) {
                const monto = parseFloat(document.getElementById("monto").value);
                const pagoData = {
                    codigoSocio: codigoSocio,
                    monto: isNaN(monto) ? 0 : monto,
                    metodoPago: document.getElementById("metodoPago").value,
                    meses: parseInt(document.getElementById("meses").value) || 1
                };

                const resPago = await fetch(`${API_BASE}/pagos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pagoData)
                });

                if (!resPago.ok) {
                    const errorPagoText = await resPago.text();
                    throw new Error(`Socio creado, pero falló el registro de pago: ${errorPagoText}`);
                }
            }

            // Exito completo
            respuestaDiv.classList.remove("hidden");
            respuestaDiv.className = "p-4 rounded-lg text-sm font-medium text-center bg-green-100 text-green-800 border border-green-200";
            respuestaDiv.innerHTML = `<i class="fa-solid fa-circle-check text-green-600 me-2"></i> ${
                esEmpleado
                    ? 'Empleado registrado exitosamente.'
                    : '¡Socio registrado y pago procesado con éxito!'
            }`;

            document.getElementById("formRegistro").reset();
            toggleSeccionPago();
            document.getElementById('codigoSocio').focus();

        } catch (error) {
            console.error(error);
            respuestaDiv.classList.remove("hidden");
            respuestaDiv.className = "p-4 rounded-lg text-sm font-medium text-center bg-red-100 text-red-800 border border-red-200";
            respuestaDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600 me-2"></i> ${error.message}`;
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Registrar y Cobrar`;
        }
    }
</script>
</body>
</html>
